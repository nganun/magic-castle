<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, height=device-height, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta content="DoubleAm的博客,贺雄彪的博客,贺雄彪,鲸落oh,江湖小栈" name="description">
  <meta Content="DoubleAm的博客,贺雄彪的博客,贺雄彪,鲸落oh,江湖小栈" name="keywords">
  <meta content="DoubleAm" name="author">
    <link rel="stylesheet" href="images/index.css">
  <title>水果忍者</title>
  <!--[if lt IE 9]>
  <script>document.createElement("canvas");</script>
  <![endif]-->
</head>
<body>
<button id="gameBack" type="button" aria-label="返回小游戏机">‹ 返回</button>
<div id="landscapeControl">
  <button id="landscapeHint" type="button" aria-describedby="landscapeStatus">横屏玩更舒服</button>
  <p id="landscapeStatus" role="status" aria-live="polite">旋转设备，画面会更宽。</p>
</div>
<div id="wrap"></div>
<div id="extra"></div>
<em> -- Fruit Ninja -- </em>
<em> The game is developed by the Baidu JS team, </em>
<em> we provide the source in git: https://github.com/ChineseDron/fruit-ninja </em>
<em> follow me on weibo http://weibo.com/baidujs </em>
<em> or learn more, to see http://tangram.baidu.com </em>
<canvas id="view" width="640" height="480"></canvas>

<div id="desc">
  <div style="text-align:center;clear:both;">
    <script src="/gg_bd_ad_720x90.js" type="text/javascript"></script>
    <script src="/follow.js" type="text/javascript"></script>
  </div>
  <div id="browser"></div>
</div>
<script src="scripts/all.js"></script>
<script>
(function () {
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  function fitFruitNinja() {
    var view = document.getElementById('view');
    var extra = document.getElementById('extra');
    if (!view || !extra) return;
    var availableWidth = Math.max(1, document.documentElement.clientWidth - 8);
    var availableHeight = Math.max(1, document.documentElement.clientHeight - 8);
    var scale = Math.min(availableWidth / 640, availableHeight / 480, 1);
    [view, extra].forEach(function (node) {
      node.style.margin = '0';
      node.style.left = '50%';
      node.style.top = '50%';
      node.style.transformOrigin = 'center center';
      node.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    });
  }
  window.addEventListener('resize', fitFruitNinja);
  window.addEventListener('load', fitFruitNinja);
  setTimeout(fitFruitNinja, 50);
  var hint = document.getElementById('landscapeHint');
  var back = document.getElementById('gameBack');
  var status = document.getElementById('landscapeStatus');
  function setLandscapeStatus(message) { status.textContent = message; }
  function isLandscape() { return window.innerWidth > window.innerHeight; }
  function tellHost() {
    if (window.parent === window) return;
    window.parent.postMessage({ type: 'magic-castle:fruit-landscape-request' }, '*');
  }
  async function requestLandscape() {
    tellHost();
    var fullscreenRequested = false;
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
        fullscreenRequested = true;
      }
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
        setLandscapeStatus('已切换为横屏模式。');
      } else if (fullscreenRequested) {
        setLandscapeStatus('已进入全屏，请旋转设备获得更宽画面。');
      } else {
        setLandscapeStatus('已请求横屏模式。');
      }
    } catch (error) {
      setLandscapeStatus(isLandscape() ? '当前已经是横向画面。' : '请旋转设备或点击横屏。');
    }
  }
  function leaveGame() {
    try { screen.orientation?.unlock?.(); } catch (e) {}
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
    if (window.parent !== window) window.parent.postMessage({ type: 'magic-castle:fruit-exit-request' }, '*');
  }
  hint.addEventListener('click', requestLandscape);
  back.addEventListener('click', leaveGame);
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      fitFruitNinja();
      if (isLandscape()) setLandscapeStatus('已是横屏画面。');
    }, 100);
  });
  window.addEventListener('message', function (event) {
    if (event.data?.type === 'magic-castle:fruit-landscape-result' && event.data.locked) {
      setLandscapeStatus('已切换为横屏模式。');
      setTimeout(fitFruitNinja, 100);
    }
    if (event.data?.type === 'magic-castle:fruit-landscape-release') leaveGame();
  });
}());
</script>
</body>
</html>
