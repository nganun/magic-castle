<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>一箭又一箭</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e6;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #phaser-example {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        display: block;
        touch-action: none;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
    <script>
      if (typeof window !== 'undefined' && window.URL && window.URL.createObjectURL) {
        const origCreateObjectURL = window.URL.createObjectURL.bind(window.URL);
        window.URL.createObjectURL = function (obj) {
          if (obj instanceof ArrayBuffer || ArrayBuffer.isView(obj)) {
            return origCreateObjectURL(new Blob([obj], { type: 'image/png' }));
          }
          return origCreateObjectURL(obj);
        };
      }
    </script>
    <script src="js/libs/phaser.min.js"></script>
    <script>
      if (window.Phaser && window.Phaser.Loader && window.Phaser.Loader.File) {
        const origFileCreateObjectURL = window.Phaser.Loader.File.createObjectURL;
        window.Phaser.Loader.File.createObjectURL = function (image, blob, defaultType) {
          if (blob instanceof ArrayBuffer || ArrayBuffer.isView(blob)) {
            blob = new Blob([blob], { type: defaultType || 'image/png' });
          }
          return origFileCreateObjectURL.call(this, image, blob, defaultType);
        };
      }
    </script>
</head>
<body>
    <div id="phaser-example"></div>
    <script src="js/main.js" type="module"></script>
</body>
</html>
