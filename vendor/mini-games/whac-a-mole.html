<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<meta name="description" content="小游戏合集 · 🔨 打地鼠">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Ctext%20y%3D%2714%27%20font-size%3D%2714%27%3E%F0%9F%8E%AE%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔨 打地鼠</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;user-select:none;-webkit-user-select:none}
h1{margin:20px 0 10px;font-size:1.8em;color:#e94560}
#info{font-size:1.1em;margin-bottom:15px;color:#aaa}
#info span{color:#fff;font-weight:bold}
#board{display:grid;grid-template-columns:repeat(3,110px);gap:14px;margin-bottom:20px}
.hole{width:110px;height:110px;background:#0f3460;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;border:4px solid #16213e;box-shadow:inset 0 8px 12px rgba(0,0,0,0.6);touch-action:manipulation}
.hole::before{content:'';position:absolute;bottom:0;width:100%;height:35%;background:#091b33;border-radius:0 0 55px 55px;z-index:2}
.mole{position:absolute;font-size:52px;line-height:1;transition:transform 0.16s cubic-bezier(0.18, 0.89, 0.32, 1.28);transform:translateY(80px);z-index:1;pointer-events:none}
.hole.active .mole{transform:translateY(-4px)}
.hole.hit{animation:hitEffect 0.22s ease}
.hole.hit .mole{transform:translateY(-4px) scale(0.85);filter:brightness(1.2)}
@keyframes hitEffect{0%{transform:scale(1)}50%{transform:scale(0.92)}100%{transform:scale(1)}}
.hit-star{position:absolute;font-size:26px;color:#facc15;z-index:3;animation:popStar 0.35s ease-out forwards;pointer-events:none}
@keyframes popStar{0%{transform:scale(0.4) rotate(0deg);opacity:1}100%{transform:scale(1.3) translateY(-25px) rotate(45deg);opacity:0}}
#controls{display:flex;gap:15px;margin-bottom:20px}
button{padding:10px 28px;font-size:1em;border:none;border-radius:8px;cursor:pointer;background:#e94560;color:#fff;font-weight:bold;transition:.2s}
button:hover{background:#c7364f;transform:scale(1.05)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
#timer{font-size:1.2em;margin-bottom:15px;color:#7ec8e3}
.back{position:absolute;top:15px;left:15px;color:#888;text-decoration:none}
.back:hover{color:#e94560}

body{padding-bottom:env(safe-area-inset-bottom,0px)}
@media(orientation:landscape){body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}}
@media(max-width:400px){#board{grid-template-columns:repeat(3,95px);gap:10px}.hole{width:95px;height:95px}.mole{font-size:44px}}
</style></head><body>
<h1>🔨 打地鼠</h1>
<p id="timer">⏱ 30s</p>
<div id="info">得分: <span id="score">0</span> | 最高: <span id="high">0</span></div>
<div id="board"></div>
<div id="controls"><button id="startBtn">开始游戏</button></div>
<script>
const board=document.getElementById('board'),scoreEl=document.getElementById('score')
const highEl=document.getElementById('high'),timerEl=document.getElementById('timer')
const startBtn=document.getElementById('startBtn')
let score=0,high=parseInt(localStorage.getItem('whacHigh')||'0'),timeLeft=30
let timer=null,moleInterval=null,active=false
highEl.textContent=high

for(let i=0;i<9;i++){
  const d=document.createElement('div');
  d.className='hole';
  d.dataset.id=i;
  const m=document.createElement('div');
  m.className='mole';
  m.textContent='🐹';
  d.appendChild(m);
  board.appendChild(d);
}

const holes=document.querySelectorAll('.hole')
function getRand(){return Math.floor(Math.random()*9)}
function showMole(){
  holes.forEach(h=>{
    h.classList.remove('active');
    const mole = h.querySelector('.mole');
    if(mole) mole.textContent='🐹';
  });
  const i=getRand();
  holes[i].classList.add('active');
}
function hideMole(){
  holes.forEach(h=>{
    h.classList.remove('active');
    const mole = h.querySelector('.mole');
    if(mole) mole.textContent='🐹';
  });
}

function popHitStar(hole){
  const star = document.createElement('div');
  star.className = 'hit-star';
  star.textContent = '💥';
  hole.appendChild(star);
  setTimeout(()=>star.remove(), 350);
}

function whack(e){
  if(!active)return
  const h=e.currentTarget
  if(h.classList.contains('active')){
    score++;scoreEl.textContent=score
    h.classList.remove('active');
    h.classList.add('hit');
    const mole = h.querySelector('.mole');
    if(mole) mole.textContent='😵';
    popHitStar(h);
    setTimeout(()=>{
      h.classList.remove('hit');
      if(mole) mole.textContent='🐹';
    }, 250);
  }
}
holes.forEach(h=>h.addEventListener('pointerdown',whack))
function startGame(){
  score=0;timeLeft=30;active=true
  scoreEl.textContent='0';timerEl.textContent='⏱ 30s'
  startBtn.disabled=true;startBtn.textContent='游戏中...'
  showMole()
  moleInterval=setInterval(()=>{if(active)showMole()},750)
  timer=setInterval(()=>{
    timeLeft--;timerEl.textContent=`⏱ ${timeLeft}s`
    if(timeLeft<=0)endGame()
  },1000)
}
function endGame(){
  active=false
  clearInterval(timer);clearInterval(moleInterval)
  hideMole()
  startBtn.disabled=false;startBtn.textContent='再来一局'
  if(score>high){high=score;localStorage.setItem('whacHigh',high);highEl.textContent=high}
  timerEl.textContent=`⏱ 结束！得分: ${score}`
}
startBtn.addEventListener('click',()=>{if(startBtn.textContent==='结束游戏')endGame();else startGame()})
</script></body></html>
