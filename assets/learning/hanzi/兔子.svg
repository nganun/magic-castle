<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <rect width="240" height="180" rx="28" fill="#fdf2f8"/>
  <ellipse cx="120" cy="156" rx="60" ry="10" fill="#fce7f3"/>

  <!-- 两只直立长长大兔耳 -->
  <!-- 左长耳 -->
  <g transform="translate(95, 12)">
    <ellipse cx="0" cy="38" rx="14" ry="40" transform="rotate(-8)" fill="#ffffff" stroke="#cbd5e1" stroke-width="3.5"/>
    <ellipse cx="0" cy="38" rx="7" ry="28" transform="rotate(-8)" fill="#f472b6"/>
  </g>
  <!-- 右长耳 -->
  <g transform="translate(145, 12)">
    <ellipse cx="0" cy="38" rx="14" ry="40" transform="rotate(8)" fill="#ffffff" stroke="#cbd5e1" stroke-width="3.5"/>
    <ellipse cx="0" cy="38" rx="7" ry="28" transform="rotate(8)" fill="#f472b6"/>
  </g>

  <!-- 兔子圆滚滚身体与脑袋（一体式可爱造型） -->
  <ellipse cx="120" cy="115" rx="46" ry="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="3.5"/>

  <!-- 红宝石大眼睛 -->
  <circle cx="102" cy="102" r="6" fill="#ef4444"/><circle cx="104" cy="100" r="2.5" fill="#ffffff"/>
  <circle cx="138" cy="102" r="6" fill="#ef4444"/><circle cx="140" cy="100" r="2.5" fill="#ffffff"/>

  <!-- 粉红三瓣嘴与小鼻子 -->
  <polygon points="120,112 116,108 124,108" fill="#f472b6"/>
  <path d="M120 112 v4 m0 0 c-3 3-6 2-8 0 m8 0 c3 3 6 2 8 0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- 粉嫩小腮红 -->
  <circle cx="92" cy="112" r="5" fill="#fbcfe8"/>
  <circle cx="148" cy="112" r="5" fill="#fbcfe8"/>

  <!-- 胸前两只小胖手抱着一根大橙胡萝卜 -->
  <g transform="translate(112, 122) rotate(-25)">
    <!-- 胡萝卜身 -->
    <path d="M0 0 L32 0 L16 38 Z" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <line x1="8" y1="12" x2="24" y2="12" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="22" x2="22" y2="22" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
    <!-- 绿叶缨 -->
    <path d="M16 0 L8-10 M16 0 L16-12 M16 0 L24-10" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- 抱住胡萝卜的白兔小爪子 -->
  <circle cx="106" cy="132" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="134" cy="132" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
</svg>
