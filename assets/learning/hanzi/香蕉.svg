<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <rect width="240" height="180" rx="28" fill="#fefce8"/>
  <ellipse cx="120" cy="154" rx="72" ry="12" fill="#fef08a"/>

  <!-- 连在一起的青绿果柄基座 -->
  <g transform="translate(48, 52) rotate(-22)">
    <rect x="0" y="0" width="18" height="24" rx="4" fill="#65a30d" stroke="#3f6212" stroke-width="2.5"/>
    <ellipse cx="9" cy="0" rx="9" ry="4" fill="#84cc16"/>
  </g>

  <!-- 下方香蕉（稍靠后，层次饱满） -->
  <g transform="translate(46, 52)">
    <path d="M12 20 
      C45 4 105 16 138 68 
      C142 76 132 82 125 76 
      C96 52 50 38 10 44 
      C2 44 4 24 12 20 Z" 
      fill="#eab308" stroke="#ca8a04" stroke-width="3.5"/>
    <!-- 尖头黑果脐 -->
    <circle cx="140" cy="74" r="3.5" fill="#78350f"/>
  </g>

  <!-- 上方主香蕉（饱满、弯曲优美、棱线极其明显） -->
  <g transform="translate(42, 38)">
    <path d="M14 20 
      C50 2 118 16 150 72 
      C154 80 144 86 136 80 
      C102 54 52 38 10 46 
      C2 46 4 24 14 20 Z" 
      fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    
    <!-- 标志性纵向棱线弧光 -->
    <path d="M22 28 C60 16 112 28 138 66" stroke="#fef08a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M20 38 C56 30 98 42 126 72" stroke="#ca8a04" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- 尖头深褐果脐 -->
    <circle cx="151" cy="78" r="4" fill="#78350f"/>
  </g>
</svg>
